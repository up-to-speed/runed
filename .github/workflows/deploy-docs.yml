name: Deploy Docs
on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: macos-latest
    permissions:
      contents: read
      deployments: write
    name: Manual Docs Deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build contributors
        run: pnpm build:contributors
        env:
          GITHUB_TOKEN: ${{ secrets.READONLY_CONTRIBUTORS_TOKEN }}

      - name: Build package & site
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: AdrianGonz97/refined-cf-pages-action@45ea15c1c69a7bce8ffbb79ba114daa2b52f0cff # v1.3.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: runed
          directory: ./.svelte-kit/cloudflare
          workingDirectory: sites/docs
          deploymentName: Production
          wranglerVersion: "" # uses the local version of wrangler
