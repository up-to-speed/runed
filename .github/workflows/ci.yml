name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".changeset/**"
      - README.md
      - ".vscode/**"
      - packages/runed/CHANGELOG.md
  pull_request:
    paths-ignore:
      - ".changeset/**"
      - README.md
      - ".vscode/**"
      - packages/runed/CHANGELOG.md

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  pinned-actions:
    name: Check GitHub Actions are pinned to commit SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check-pinned-actions.py

  check:
    name: Run svelte-check
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, 'chore(release): version package')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build:packages

      - name: Sync
        run: pnpm sync

      - name: Run svelte-check
        run: pnpm check

  test:
    runs-on: macos-latest
    name: Test
    if: "!contains(github.event.head_commit.message, 'chore(release): version package')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        working-directory: ./packages/runed
        run: pnpm exec playwright install --with-deps

      - run: pnpm test

  lint:
    runs-on: macos-latest
    name: Lint
    if: "!contains(github.event.head_commit.message, 'chore(release): version package')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - run: pnpm lint
